<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vallax Hero Export</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        font-family:
          "Nunito Variable",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 48px;
      }

      .stage {
        position: relative;
        width: 560px;
        height: 980px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hero-glow {
        position: absolute;
        inset: 12% 8% 10%;
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 35%, rgba(7, 217, 196, 0.28), rgba(7, 217, 196, 0.02) 55%, transparent 75%),
          radial-gradient(circle at 50% 70%, rgba(49, 79, 139, 0.28), transparent 58%);
        filter: blur(48px);
      }

      .phone-shell {
        position: relative;
        z-index: 2;
        width: 340px;
      }

      .screen-shadow {
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.48),
          0 8px 24px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        border-radius: 2.8rem;
        border: 7px solid #1c2127;
        background: #0c1014;
        padding: 8px;
      }

      .screen {
        position: relative;
        aspect-ratio: 9 / 19;
        overflow: hidden;
        border-radius: 2.15rem;
        background:
          radial-gradient(circle at top, #314f8b 0%, #16233f 36%, #0d1320 72%, #091019 100%);
      }

      .dynamic-island {
        position: absolute;
        left: 50%;
        top: 12px;
        width: 42%;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.8);
      }

      .glass-overlay {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.18), transparent 28%, transparent 70%, rgba(255, 255, 255, 0.08));
      }

      .content {
        position: relative;
        display: flex;
        height: 100%;
        flex-direction: column;
        padding: 48px 20px 24px;
      }

      .lock-screen {
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
      }

      .lock-screen .date {
        font-size: 14px;
        font-weight: 700;
      }

      .lock-screen .time {
        margin-top: 8px;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 3px;
        font-size: 76px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: rgba(255, 255, 255, 0.85);
      }

      .lock-screen .time .colon {
        transform: translateY(-1px);
      }

      .notification-stack {
        position: relative;
        height: 320px;
        margin-top: 40px;
      }

      .notification-card {
        position: absolute;
        inset-inline: 0;
        top: 0;
        border-radius: 1.45rem;
        padding: 10px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .notification-card.third {
        transform: translateY(188px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.08);
      }

      .notification-card.first {
        transform: translateY(94px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.14);
      }

      .notification-card.second {
        transform: translateY(0);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.1);
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .app-icon {
        display: flex;
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-radius: 999px;
        background: #0c1014;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .app-icon img {
        width: 16px;
        height: 16px;
        object-fit: contain;
      }

      .main {
        min-width: 0;
        flex: 1;
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .brand {
        font-size: 11px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.78);
      }

      .ago {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.5);
      }

      .body {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 4px;
      }

      .copy {
        min-width: 0;
        flex: 1;
      }

      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        line-height: 1.15;
        font-weight: 700;
        color: #fff;
      }

      .price {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.2;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.74);
      }

      .thumb {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        overflow: hidden;
        border-radius: 0.85rem;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="hero-glow"></div>
      <div class="phone-shell">
        <div class="screen-shadow">
          <div class="screen">
            <div class="dynamic-island"></div>
            <div class="glass-overlay"></div>
            <div class="content">
              <div class="lock-screen">
                <div class="date">Tue Apr 1</div>
                <div class="time">
                  <span>9</span>
                  <span class="colon">:</span>
                  <span>41</span>
                </div>
              </div>

              <div class="notification-stack">
                <div class="notification-card third">
                  <div class="row">
                    <div class="app-icon">
                      <img src="file:///home/insomnis/Projects/vallax.es/public/favicon-d.svg" alt="" />
                    </div>
                    <div class="main">
                      <div class="head">
                        <div class="brand">Vallax</div>
                        <div class="ago">2m ago</div>
                      </div>
                      <div class="body">
                        <div class="copy">
                          <div class="title">Xbox Series X</div>
                          <div class="price">280 €</div>
                        </div>
                        <div class="thumb">
                          <img src="file:///home/insomnis/Projects/vallax.es/src/images/hero/xbox.jpg" alt="" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="notification-card first">
                  <div class="row">
                    <div class="app-icon">
                      <img src="file:///home/insomnis/Projects/vallax.es/public/favicon-d.svg" alt="" />
                    </div>
                    <div class="main">
                      <div class="head">
                        <div class="brand">Vallax</div>
                        <div class="ago">1m ago</div>
                      </div>
                      <div class="body">
                        <div class="copy">
                          <div class="title">Playstation 5</div>
                          <div class="price">350 €</div>
                        </div>
                        <div class="thumb">
                          <img src="file:///home/insomnis/Projects/vallax.es/src/images/hero/playstation.jpg" alt="" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="notification-card second">
                  <div class="row">
                    <div class="app-icon">
                      <img src="file:///home/insomnis/Projects/vallax.es/public/favicon-d.svg" alt="" />
                    </div>
                    <div class="main">
                      <div class="head">
                        <div class="brand">Vallax</div>
                        <div class="ago">now</div>
                      </div>
                      <div class="body">
                        <div class="copy">
                          <div class="title">Nintendo Switch</div>
                          <div class="price">100 €</div>
                        </div>
                        <div class="thumb">
                          <img src="file:///home/insomnis/Projects/vallax.es/src/images/hero/nintendo-switch.jpg" alt="" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
